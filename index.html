<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Devis et factures — DC RENOV</title>
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Devis DC RENOV">
<style>
:root{--bg:#f2f5f7;--card:#fff;--tx:#18222c;--mut:#5f6c78;--bd:#d3dbe1;--acc:#1f3a4d;--on:#fff;--soft:#e6edf1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11171c;--card:#1a232b;--tx:#e8edf1;--mut:#9aa7b3;--bd:#33414d;--acc:#6fb0d6;--on:#0c1216;--soft:#243039}}
:root[data-theme="dark"]{--bg:#11171c;--card:#1a232b;--tx:#e8edf1;--mut:#9aa7b3;--bd:#33414d;--acc:#6fb0d6;--on:#0c1216;--soft:#243039}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:12px 14px 40px}
header{display:flex;align-items:center;gap:10px;justify-content:space-between}
header h1{font-size:18px;margin:6px 0}
.pb{height:6px;background:var(--soft);border-radius:4px;margin:8px 0 4px;overflow:hidden}.pb i{display:block;height:100%;background:var(--acc);width:0;transition:width .25s}
#stt{color:var(--mut);font-size:14px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--mut);margin:0 0 10px}
input,select,textarea{display:block;width:100%;margin-top:4px;padding:11px;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px}
input[type=checkbox]{display:inline-block;width:auto;margin:0 8px 0 0}
.g3{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:8px}
.tg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{font:inherit;padding:11px 16px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer}
button.pri{background:var(--acc);color:var(--on);border-color:var(--acc);font-weight:600}
button.sel{background:var(--acc);color:var(--on);border-color:var(--acc)}
#nav{display:flex;gap:10px;justify-content:space-between;position:sticky;bottom:0;padding:10px 0;background:var(--bg)}
#nav button{flex:1}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.hint{font-size:13px;color:var(--mut)}
.big{font-size:20px;font-weight:700}
.doc{background:#fff;color:#111}
@media print{body{background:#fff}.ui{display:none!important}.wrap{padding:0;max-width:none}.doc{border:0!important;border-radius:0!important;padding:0!important}@page{size:A4;margin:10mm}}
</style>
<style id="ds">
.doc{font:12px/1.35 Arial,Helvetica,sans-serif;background:#fff;color:#111;border:1px solid #d3dbe1;border-radius:6px;padding:18px;margin-bottom:12px}
.doc *{box-sizing:border-box}
.dh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.dh img{width:130px;height:auto}
.dt{text-align:right}.dt h1{margin:0 0 6px;font-size:26px;color:#1f3a4d}
.dt table{margin-left:auto;border-collapse:collapse}.dt td{padding:2px 0 2px 8px;font-size:12px}.dt td:first-child{color:#1f3a4d;font-weight:700}
.dg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.dg h3{margin:0 0 4px;padding:4px 6px;background:#e6edf1;color:#1f3a4d;font-size:12px}
.dg p{margin:0;padding:3px 6px;border-bottom:1px solid #e1e7ec;min-height:20px}
.ln{width:100%;border-collapse:collapse;margin-top:6px}
.ln th{background:#1f3a4d;color:#fff;font-size:11px;padding:6px;text-align:left}
.ln td{border-bottom:1px solid #d9e0e5;padding:6px;vertical-align:top}
.ln .r{text-align:right;white-space:nowrap}.ln .c{text-align:center}
thead{display:table-header-group}tr{break-inside:avoid}
.tot{margin:10px 0 4px auto;border-collapse:collapse;min-width:260px}.tot td{padding:4px 8px;text-align:right}.tot tr.b td{font-weight:700}.tot tr.f td{background:#e6edf1;color:#1f3a4d;font-weight:700;font-size:14px}
.note{font-size:10px;color:#666;font-style:italic;margin:4px 0}
.ment{margin-top:12px;font-size:10px;color:#333;break-inside:avoid}.ment h4{margin:0 0 4px;padding:4px 6px;background:#e6edf1;color:#1f3a4d;font-size:11px}.ment p{margin:0 0 4px}
.sig{margin-top:12px;font-weight:700;color:#1f3a4d;break-inside:avoid}.sig div{height:70px;border:1px solid #888;margin-top:4px;padding:4px;font-weight:400;font-style:italic;font-size:10px;color:#666}
</style></head>

const $=s=>document.querySelector(s);
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const today=()=>new Date().toISOString().slice(0,10);
const blank=()=>({type:"FACTURE",date:today(),trav:"",num:"",cl:{nom:"",adr:"",cp:"",ct:"",siren:""},ch:{same:true,adr:"",cp:"",comp:""},lines:[{d:"",u:"m²",q:1,p:0}],tva:10,ac:[0,0,0],nat:"Prestation de services"});
let S=Object.assign(blank(),LS.get("dc_draft",{})),ST=Object.assign({capital:"",siret:"",tva:"",assur:"",med:"",deb:false,valid:3,delai:0,pen:"3 fois le taux d’intérêt légal",ind:40},LS.get("dc_set",{}));
let step=0,showSet=false;
const STEPS=["Type et dates","Client","Chantier","Prestations","TVA et acomptes","Aperçu"];
const save=()=>{LS.set("dc_draft",S);LS.set("dc_set",ST)};
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const eur=n=>(+n||0).toLocaleString("fr-FR",{style:"currency",currency:"EUR"});
const dfr=i=>{if(!i)return"";const[a,m,j]=i.split("-");return j+"/"+m+"/"+a};
const addD=(i,n)=>{const d=new Date(i+"T12:00:00");d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const addM=(i,n)=>{const d=new Date(i+"T12:00:00");d.setMonth(d.getMonth()+n);return d.toISOString().slice(0,10)};
const dev=()=>S.type==="DEVIS";
function T(){const ht=S.lines.reduce((a,l)=>a+(+l.q||0)*(+l.p||0),0),tv=Math.round(ht*S.tva)/100,ttc=ht+tv,ac=S.ac.reduce((a,b)=>a+(+b||0),0);return{ht,tv,ttc,ac,rest:ttc-ac}}
function nk(){const k=(dev()?"DEV":"FAC")+"-"+S.date.slice(0,4);return{k,n:(LS.get("dc_cnt",{})[k]||0)+1}}
const numStr=()=>{if(S.num)return S.num;const{k,n}=nk();return k+"-"+String(n).padStart(3,"0")};
function commit(){if(S.num)return;const{k,n}=nk(),c=LS.get("dc_cnt",{});c[k]=n;LS.set("dc_cnt",c);S.num=k+"-"+String(n).padStart(3,"0");save()}
const G=(o,k)=>k.split(".").reduce((a,b)=>a[b],o==="S"?S:ST);
const F=(l,o,k,t="text",x="")=>`<label>${l}<input type="${t}" ${x} value="${esc(G(o,k))}" data-o="${o}" data-k="${k}"></label>`;
function s0(){return`<div class="card"><label>Que voulez-vous créer ?</label><div class="tg"><button class="${dev()?"":"sel"}" data-a="type" data-v="FACTURE">Facture</button><button class="${dev()?"sel":""}" data-a="type" data-v="DEVIS">Devis</button></div></div><div class="card">${F("Date d’émission","S","date","date")}${F(dev()?"Début des travaux (facultatif)":"Date des travaux (facultatif)","S","trav","date")}<p class="hint">${dev()?"Le devis sera valable jusqu’au "+dfr(addM(S.date,+ST.valid||3))+".":"Échéance de paiement : "+dfr(addD(S.date,+ST.delai||0))+(+ST.delai?"":" (à réception).")}</p></div>`}
const s1=()=>`<div class="card">${F("Nom / Prénom ou Société","S","cl.nom")}${F("Adresse (rue)","S","cl.adr")}${F("Code postal et ville","S","cl.cp")}${F("Email / Téléphone","S","cl.ct")}${F("SIREN (si le client est un professionnel)","S","cl.siren","text",'inputmode="numeric"')}</div>`;
const s2=()=>`<div class="card"><label style="font-size:15px;color:var(--tx)"><input type="checkbox" data-o="S" data-k="ch.same" data-r="1" ${S.ch.same?"checked":""}>Le chantier est à la même adresse que le client</label>${S.ch.same?"":F("Adresse du chantier (rue)","S","ch.adr")+F("Code postal et ville","S","ch.cp")+F("Complément (étage, accès…)","S","ch.comp")}</div>`;
function s3(){return S.lines.map((l,i)=>{const si=CAT.findIndex(c=>c[0]===l.d);return`<div class="card"><label>Prestation du catalogue<select data-sel="${i}"><option value="">Autre prestation (à saisir)</option>${CAT.map((c,j)=>`<option value="${j}" ${j===si?"selected":""}>${esc(c[0])}</option>`).join("")}</select></label><label>Désignation<textarea rows="2" data-i="${i}" data-f="d">${esc(l.d)}</textarea></label><div class="g3"><label>Quantité<input type="number" inputmode="decimal" step="any" value="${esc(l.q)}" data-i="${i}" data-f="q"></label><label>Unité<input value="${esc(l.u)}" data-i="${i}" data-f="u"></label><label>Prix unitaire HT (€)<input type="number" inputmode="decimal" step="any" value="${esc(l.p)}" data-i="${i}" data-f="p"></label></div><div class="row"><b id="lt${i}">${eur((+l.q||0)*(+l.p||0))}</b>${S.lines.length>1?`<button data-a="del" data-i="${i}">Supprimer</button>`:""}</div></div>`}).join("")+`<button data-a="add" style="width:100%">+ Ajouter une ligne</button><p class="big" style="text-align:right">Total HT : <span id="tht">${eur(T().ht)}</span></p>`}
const s4=()=>`<div class="card"><label>Taux de TVA<select data-o="S" data-k="tva" data-n="1">${[5.5,10,20].map(v=>`<option value="${v}" ${+S.tva===v?"selected":""}>${String(v).replace(".",",")} %</option>`).join("")}</select></label><label>Nature de l’opération<select data-o="S" data-k="nat">${["Prestation de services","Livraison de biens","Opération mixte (biens + services)"].map(v=>`<option ${S.nat===v?"selected":""}>${v}</option>`).join("")}</select></label></div><div class="card"><label>${dev()?"Acomptes prévus":"Acomptes déjà versés"} (€, facultatif)</label>${[0,1,2].map(i=>`<label>Acompte ${i+1}<input type="number" inputmode="decimal" step="any" value="${S.ac[i]||""}" data-ac="${i}"></label>`).join("")}</div>`;
const setHTML=()=>`<div class="card">${F("Capital social (€)","ST","capital")}${F("N° SIRET","ST","siret")}${F("N° de TVA intracommunautaire","ST","tva")}${F("Assurance décennale (assureur, adresse, zone géographique)","ST","assur")}${F("Médiateur de la consommation (particuliers)","ST","med")}<label style="font-size:15px;color:var(--tx)"><input type="checkbox" data-o="ST" data-k="deb" ${ST.deb?"checked":""}>Option pour le paiement de la TVA d’après les débits</label></div><div class="card">${F("Validité des devis (mois)","ST","valid","number")}${F("Délai de paiement des factures (jours, 0 = à réception)","ST","delai","number")}${F("Pénalités de retard","ST","pen")}${F("Indemnité forfaitaire de recouvrement (€)","ST","ind","number")}</div><p class="hint">Ces informations sont conservées sur cet appareil et apparaissent dans les mentions légales.</p>`;
function docHTML(){const t=T(),n=numStr(),D=dev(),c=S.cl,h=S.ch.same?c:S.ch,ech=D?addM(S.date,+ST.valid||3):addD(S.date,+ST.delai||0);
const p=(v,l)=>`<p>${esc(v)||`<span style="color:#999">${l}</span>`}</p>`;
const rows=S.lines.filter(l=>l.d||+l.p).map(l=>`<tr><td class="c">${esc(l.q)}</td><td class="c">${esc(l.u)}</td><td>${esc(l.d)}</td><td class="r">${eur(l.p)}</td><td class="r">${eur((+l.q||0)*(+l.p||0))}</td></tr>`).join("");
const note=+S.tva===10?"TVA 10 % : taux réduit applicable aux travaux d’amélioration d’un logement achevé depuis plus de 2 ans, sous réserve de l’attestation du client.":+S.tva===5.5?"TVA 5,5 % : taux réduit applicable aux travaux de rénovation énergétique éligibles, sous réserve de l’attestation du client.":"";
const cond=D?`Devis gratuit, valable ${ST.valid} mois à compter de sa date d’émission. Acompte de 30 % à la commande. Assurance décennale souscrite auprès de notre assureur.`:`Conditions de paiement : ${+ST.delai?"paiement sous "+ST.delai+" jours à compter de la date de facture":"paiement à réception de facture"}. Pas d’escompte pour paiement anticipé. Tout retard de paiement entraîne une pénalité égale à ${esc(ST.pen)} ainsi qu’une indemnité forfaitaire de ${esc(ST.ind)} € pour frais de recouvrement.`;
const ac=S.ac.map((a,i)=>+a?`<tr><td>${D?"Acompte prévu":"Acompte versé"} ${i+1} :</td><td>${eur(a)}</td></tr>`:"").join("");
return`<div class="doc" id="doc"><div class="dh"><img src="${LOGO}" alt="DC RENOV"><div class="dt"><h1>${D?"DEVIS":"FACTURE"}</h1><table><tr><td>N° Document :</td><td>${n}</td></tr><tr><td>Date d’émission :</td><td>${dfr(S.date)}</td></tr>${S.trav?`<tr><td>${D?"Début des travaux :":"Date des travaux :"}</td><td>${dfr(S.trav)}</td></tr>`:""}<tr><td>${D?"Valable jusqu’au :":"Échéance de paiement :"}</td><td>${dfr(ech)}</td></tr></table></div></div>
<div class="dg"><div><h3>${D?"DEVIS POUR :":"FACTURER À :"}</h3>${p(c.nom,"Nom du client")}${p(c.adr,"Adresse")}${p(c.cp,"Code postal et ville")}${p(c.ct,"Email / Téléphone")}${c.siren?p("SIREN : "+c.siren):""}</div><div><h3>ADRESSE DU CHANTIER :</h3>${p(h.adr,"Adresse")}${p(h.cp,"Code postal et ville")}${S.ch.same?"":p(h.comp,"Complément")}<p><b>Nature de l’opération :</b> ${esc(S.nat)}</p></div></div>
<table class="ln"><thead><tr><th class="c">Qté</th><th class="c">Unité</th><th>Détails / Description des travaux</th><th class="r">Prix unitaire HT</th><th class="r">Total HT</th></tr></thead><tbody>${rows}</tbody></table>
<table class="tot"><tr class="b"><td>Total H.T.</td><td>${eur(t.ht)}</td></tr><tr><td>T.V.A. ${String(S.tva).replace(".",",")} %</td><td>${eur(t.tv)}</td></tr><tr class="b"><td>Total T.T.C.</td><td>${eur(t.ttc)}</td></tr>${ac}<tr class="f"><td>Reste à payer T.T.C.</td><td>${eur(t.rest)}</td></tr></table>
${note?`<p class="note">${note}</p>`:""}
<div class="ment"><h4>CONDITIONS ET MENTIONS LÉGALES</h4><p>${cond}</p><p>SARL DC RENOV au capital de ${esc(ST.capital)||"…"} € — ZAC 4 rue du Pré Ancel, 77510 REBAIS — RCS MEAUX 104 458 922 — SIRET ${esc(ST.siret)||"…"} — N° TVA intracommunautaire : ${esc(ST.tva)||"…"}</p><p>Assurance décennale : ${esc(ST.assur)||"…"}.${ST.med?" Médiateur de la consommation : "+esc(ST.med)+".":""}</p>${ST.deb?"<p>Option pour le paiement de la taxe d’après les débits.</p>":""}</div>
${D?`<div class="sig">BON POUR ACCORD — Date et signature du client (précédée de la mention « Devis reçu et accepté avant l’exécution des travaux ») :<div>Signature :</div></div>`:""}</div>`}
const s5=()=>docHTML()+`<div class="ui" style="display:grid;gap:10px"><button class="pri" data-a="print">Imprimer / Enregistrer en PDF</button><button data-a="copy">Enregistrer une copie du document</button><button data-a="new">Nouveau document</button><p class="hint">Dans la fenêtre d’impression, choisissez « Enregistrer au format PDF » pour obtenir un fichier. Le numéro est attribué à l’impression.</p></div>`;
function render(){const a=$("#app");$("#bar").style.width=(showSet?100:step/(STEPS.length-1)*100)+"%";$("#stt").textContent=showSet?"Réglages de l’entreprise":"Étape "+(step+1)+" sur "+STEPS.length+" — "+STEPS[step];a.innerHTML=showSet?setHTML():[s0,s1,s2,s3,s4,s5][step]();$("#nav").innerHTML=showSet?`<button class="pri" data-a="closeset">Enregistrer et fermer</button>`:(step>0?`<button data-a="back">Retour</button>`:"")+(step<5?`<button class="pri" data-a="next">${step===4?"Voir l’aperçu":"Suivant"}</button>`:"");window.scrollTo(0,0)}
function upd(){S.lines.forEach((l,i)=>{const e=$("#lt"+i);if(e)e.textContent=eur((+l.q||0)*(+l.p||0))});const e=$("#tht");if(e)e.textContent=eur(T().ht);save()}
document.addEventListener("input",e=>{const t=e.target,d=t.dataset;if(d.i!=null){S.lines[+d.i][d.f]=t.type==="number"?(t.value===""?"":+t.value):t.value;upd();return}if(d.ac!=null){S.ac[+d.ac]=t.value===""?0:+t.value;save();return}if(!d.k)return;const p=d.k.split("."),last=p.pop(),o=p.reduce((a,b)=>a[b],d.o==="S"?S:ST);o[last]=t.type==="checkbox"?t.checked:t.type==="number"?(t.value===""?"":+t.value):d.n?+t.value:t.value;if(d.k==="date")S.num="";save();if(d.r)render()});
document.addEventListener("change",e=>{const t=e.target;if(t.dataset.sel!=null){const l=S.lines[+t.dataset.sel];if(t.value!==""){const c=CAT[+t.value];l.d=c[0];l.u=c[1];l.p=c[2]}save();render();return}if(t.tagName==="SELECT"&&t.dataset.k){const p=t.dataset.k.split("."),last=p.pop(),o=p.reduce((a,b)=>a[b],t.dataset.o==="S"?S:ST);o[last]=t.dataset.n?+t.value:t.value;save()}});
document.addEventListener("click",async e=>{const b=e.target.closest("button[data-a]");if(!b)return;const a=b.dataset.a;
if(a==="type"){S.type=b.dataset.v;S.num="";save();render()}
else if(a==="next"){if(step===3&&!S.lines.some(l=>l.d&&+l.p)){$("#stt").textContent="⚠ Ajoutez au moins une prestation (désignation et prix).";window.scrollTo(0,0);return}step++;render()}
else if(a==="back"){step--;render()}
else if(a==="add"){S.lines.push({d:"",u:"m²",q:1,p:0});save();render();window.scrollTo(0,document.body.scrollHeight)}
else if(a==="del"){S.lines.splice(+b.dataset.i,1);save();render()}
else if(a==="set"){showSet=true;render()}
else if(a==="closeset"){showSet=false;save();render()}
else if(a==="print"){commit();render();setTimeout(()=>window.print(),150)}
else if(a==="new"){if(b.dataset.ok){S=blank();save();step=0;render()}else{b.dataset.ok="1";b.textContent="Confirmer : effacer ce document ?";b.className="pri";setTimeout(()=>{if(b.isConnected){delete b.dataset.ok;b.textContent="Nouveau document";b.className=""}},4000)}}
else if(a==="copy"){commit();render();try{const dl=(typeof claude!=="undefined"&&claude.use)?await claude.use("downloads"):{save:async({filename,data})=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:"text/html"}));a.download=filename;document.body.appendChild(a);a.click();a.remove()}};if(!dl){$("#stt").textContent="Enregistrement indisponible ici : utilisez l’impression.";window.scrollTo(0,0);return}await dl.save({filename:S.num+".html",data:`<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><title>${S.num}</title><style>${$("#ds").textContent}body{margin:16px}@page{size:A4;margin:10mm}</style></head><body>${docHTML()}</body></html>`})}catch(err){}}
});
render();
</script></body></html>
